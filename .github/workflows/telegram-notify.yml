# Прослойка для совместимости: caller-файлы во всех репозиториях орги всё ещё
# вызывают telegram-notify.yml@main. Уведомления идут в Mattermost (#github);
# логика — в mattermost-notify.yml.

name: telegram-notify

on:
  workflow_call:
    secrets:
      MATTERMOST_GITHUB_WEBHOOK:
        required: false

jobs:
  notify:
    uses: yokeloop/.github/.github/workflows/mattermost-notify.yml@main
    secrets: inherit
